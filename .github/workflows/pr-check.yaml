name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build release AAR
        run: ./gradlew :android:assembleRelease --stacktrace

      - name: Run lint
        run: ./gradlew :android:lintRelease --stacktrace

      - name: Run unit tests
        run: ./gradlew :android:testReleaseUnitTest --stacktrace

      - name: Validate Maven publication
        run: ./gradlew :android:publishReleasePublicationToMavenLocal --stacktrace

  emulator:
    runs-on: ubuntu-latest
    needs: sdk
    strategy:
      matrix:
        api-level: [26, 29, 33, 35]
        target: [playstore]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Integration Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.api-level > 27 && 'x86_64' || 'x86' }}
          profile: pixel_3a
          script: npm run test:integration

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-${{ matrix.api-level }}-${{ matrix.target }}
          path: android/build/reports
        if: always()
