name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Set up JDK
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build release AAR
        run: ./gradlew :android:assembleRelease --stacktrace

      - name: Run lint
        run: ./gradlew :android:lintRelease --stacktrace

      - name: Run unit tests
        run: ./gradlew :android:testReleaseUnitTest --stacktrace

      - name: Validate Maven publication
        run: ./gradlew :android:publishReleasePublicationToMavenLocal --stacktrace

  emulator:
    runs-on: ubuntu-latest
    needs: sdk
    strategy:
      matrix:
        api-level: [26, 29, 33, 35]
        target: [playstore]

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Integration Tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.api-level > 27 && 'x86_64' || 'x86' }}
          profile: pixel_3a
          script: npm run test:integration

      - name: Upload Reports
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Test-Reports-${{ matrix.api-level }}-${{ matrix.target }}
          path: android/build/reports
        if: always()

  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: sdk
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: real-hub
            script: test:e2e
          - name: email-verification
            script: test:email-verification:e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: playstore
          arch: x86_64
          profile: pixel_3a
          emulator-boot-timeout: 600
          script: npm run ${{ matrix.script }}

      - name: Upload Reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: E2E-Reports-${{ matrix.name }}-${{ github.sha }}
          path: |
            android/build/reports
            android/build/outputs/androidTest-results
            app/build/reports
            app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 14
