name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip E2E tests
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (${{ matrix.name }})
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: real-hub
            script: test:e2e
          - name: email-verification
            script: test:email-verification:e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Checkout Hub
        if: matrix.name == 'real-hub'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: supertokens/supertokens-rownd-hub
          ref: 2146e7ad6f67473d7d5aadab2f94cc5373c5ff0b
          path: supertokens-rownd-hub
          token: ${{ secrets.ROWND_HUB_REPOSITORY_TOKEN }}
          persist-credentials: false

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Hub dependencies
        if: matrix.name == 'real-hub'
        run: npm ci --prefix supertokens-rownd-hub

      - name: Run E2E tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          ANDROID_HUB_DIR: ${{ github.workspace }}/supertokens-rownd-hub
        with:
          api-level: 35
          target: playstore
          arch: x86_64
          profile: pixel_3a
          emulator-boot-timeout: 600
          script: npm run ${{ matrix.script }}

      - name: Upload reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: E2E-Reports-${{ matrix.name }}-${{ github.sha }}
          path: |
            android/build/reports
            android/build/outputs/androidTest-results
            app/build/reports
            app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: e2e
    if: ${{ always() && (needs.e2e.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_tests)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure tested commit is current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; refusing to release stale commit $GITHUB_SHA."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
          npm run release -- --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
