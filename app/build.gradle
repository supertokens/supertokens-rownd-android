plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlinx-serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def envOrDefault = { name, fallback ->
    def value = System.getenv(name)
    return value == null || value.trim().isEmpty() ? fallback : value
}

def buildConfigString = { value ->
    return "\"${value.replace('\\', '\\\\').replace('"', '\\"')}\""
}

def useLocalRowndSdk = providers.gradleProperty("rowndUseLocalSdk")
    .map { it.toBoolean() }
    .getOrElse(false)

android {
    namespace 'io.rownd.rowndtestsandbox'

    compileSdk 35

    defaultConfig {
        applicationId "io.rownd.rowndtestsandbox.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [rowndDeepLinkScheme: "rowndsupertokens"]
        buildConfigField "String", "DEEP_LINK_SCHEME", '"rowndsupertokens"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "environment"
    productFlavors {
        local {
            dimension "environment"
            applicationIdSuffix ".local"
            buildConfigField "String", "API_URL", buildConfigString(envOrDefault("ANDROID_API_URL", "https://trout-uncouple-geriatric.ngrok-free.dev"))
            buildConfigField "String", "HUB_URL", buildConfigString(envOrDefault("ANDROID_HUB_URL", "https://staging.supertokens-rownd-hub.pages.dev"))
            buildConfigField "String", "APP_KEY", buildConfigString(envOrDefault("ANDROID_APP_KEY", "key_pko8eul59xz33hr21jgxvx6s"))
        }
        dev {
            dimension "environment"
            buildConfigField "String", "API_URL", '"https://trout-uncouple-geriatric.ngrok-free.dev"'
            buildConfigField "String", "HUB_URL", '"https://staging.supertokens-rownd-hub.pages.dev"'
            buildConfigField "String", "APP_KEY", '"key_m4n56mwdgys9yw0m7e2nd7zg"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

//    composeOptions {
//        kotlinCompilerExtensionVersion compose_version
//    }
}

dependencies {
    if (useLocalRowndSdk) {
        implementation project(':android')
    } else {
        implementation 'com.github.supertokens:supertokens-rownd-android:v0.0.1-beta.4'
    }

    // Google Play instant
    implementation "com.google.android.gms:play-services-instantapps:17.0.0"

    implementation 'androidx.compose.material:material:1.6.8'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.foundation:foundation:1.6.8'
    implementation 'androidx.compose.material:material:1.6.8'
    implementation 'androidx.compose.compiler:compiler:1.5.14'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation "androidx.constraintlayout:constraintlayout-compose:1.0.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.3"
    implementation "com.github.supertokens:supertokens-android:0.5.4"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.4.0'
    androidTestImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
